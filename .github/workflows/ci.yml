name: CI

on:
  pull_request:
    branches: ['main']

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: set up node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: type check
        run: pnpm type-check

      - name: test
        run: pnpm test

      - name: lint
        run: pnpm lint

      - name: format
        run: pnpm format
